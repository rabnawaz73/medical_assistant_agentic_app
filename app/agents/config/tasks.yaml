analyze_medical_report_task:
  name: Analyze Medical Report Task

  description: >
    Analyze the uploaded medical report document and extract all important
    medical information including laboratory values, diagnoses,
    prescriptions, clinical findings, and patient-related observations.

    Convert complex medical terminology into simplified language that
    non-medical users can easily understand.

    Focus on identifying:
    - laboratory test values
    - diagnosis-related information
    - prescribed medications
    - important medical observations
    - report summaries

  expected_output: >
    A structured and simplified summary of the uploaded medical report
    containing extracted medical values, diagnoses, prescriptions,
    and easy-to-understand explanations.

  agent: report_analysis_agent


evaluate_medical_values_task:
  name: Evaluate Medical Values Task

  description: >
    Review the extracted medical values from the analyzed report and compare
    them against standard clinical reference ranges.

    Identify:
    - normal values
    - abnormal values
    - high-risk indicators
    - possible health concerns

    Explain the significance of each important value in clear,
    patient-friendly language without providing definitive diagnoses.

  expected_output: >
    A detailed explanation of normal and abnormal medical values,
    including simplified interpretations and possible health implications.

  agent: medical_value_evaluator

  context:
    - analyze_medical_report_task


extract_medicine_text_task:
  name: Extract Medicine Text Task

  description: >
    Analyze the uploaded medicine image and accurately extract medicine names,
    dosage information, pharmaceutical labels, and visible text using OCR.

    Clean and organize the extracted text while minimizing OCR-related errors.

  expected_output: >
    Cleaned and structured medicine-related text extracted from
    the uploaded medicine image.

  agent: medicine_ocr_agent


research_medicine_task:
  name: Research Medicine Task

  description: >
    Analyze the extracted medicine information and explain:
    - medicine purpose
    - usage
    - dosage guidance
    - side effects
    - precautions
    - possible warnings

    If the user provides symptoms or a health condition,
    explain whether the medicine may relate to the described condition.

    Provide educational guidance only and avoid definitive
    prescription recommendations.

  expected_output: >
    A detailed yet easy-to-understand explanation of the medicine,
    including usage, precautions, side effects, and safety information.

  agent: medicine_research_agent

  context:
    - extract_medicine_text_task


analyze_symptoms_task:
  name: Analyze Symptoms Task

  description: >
    Analyze user-provided symptoms, discomfort descriptions,
    or health concerns and identify possible medical conditions
    that may relate to the symptoms.

    Estimate confidence levels for possible conditions while clearly
    indicating that results are informational and not confirmed diagnoses.

    Focus on:
    - symptom patterns
    - disease likelihood
    - related health conditions
    - symptom severity indicators

  expected_output: >
    A list of possible health conditions or diseases with confidence scores
    and simplified explanations of why each condition may match the symptoms.

  agent: symptom_analyzer_agent


generate_treatment_guidance_task:
  name: Generate Treatment Guidance Task

  description: >
    Based on identified symptoms, possible conditions,
    or abnormal medical findings, provide supportive health guidance,
    preventive care suggestions, lifestyle improvements,
    dietary recommendations, and wellness precautions.

    Avoid prescribing medications or presenting unsafe medical claims.

  expected_output: >
    A patient-friendly set of lifestyle recommendations,
    wellness suggestions, preventive care advice,
    and supportive health precautions.

  agent: treatment_suggestion_agent

  context:
    - analyze_symptoms_task
    - evaluate_medical_values_task


generate_final_response_task:
  name: Generate Final Response Task

  description: >
    Combine outputs generated by all medical system agents into one
    final, well-structured, accurate, and easy-to-understand response.

    Ensure:
    - consistency between outputs
    - removal of contradictions
    - simplified explanations
    - professional formatting
    - supportive and educational tone

    The final response should be understandable for users
    without medical knowledge.

  expected_output: >
    A complete patient-friendly medical assistant response containing:
    - simplified report explanations
    - abnormal and normal findings
    - medicine information
    - symptom analysis
    - wellness recommendations
    - health precautions

  agent: supervisor_agent

  context:
    - analyze_medical_report_task
    - evaluate_medical_values_task
    - research_medicine_task
    - analyze_symptoms_task
    - generate_treatment_guidance_task